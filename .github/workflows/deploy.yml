# Bouwt de site en zet hem op GitHub Pages, bij elke push naar main.
name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk; een nieuwe push wacht netjes op de vorige.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Basispad en adres bepalen
        id: pad
        run: |
          # Een repo die eindigt op .github.io staat op de wortel van het
          # domein; elke andere repo staat onder /<repo>/.
          # VITE_SITE_URL is alleen de oorsprong; het pad komt uit VITE_BASE,
          # anders staat de repo-naam twee keer in elke canonical.
          echo "site=https://${{ github.repository_owner }}.github.io" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Bouwen
        env:
          VITE_BASE: ${{ steps.pad.outputs.base }}
          VITE_SITE_URL: ${{ steps.pad.outputs.site }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
